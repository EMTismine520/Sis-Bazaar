<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9f3e5">
  <title>蔬菜合成美术提案</title>
  <style>
    :root {
      color-scheme: light;
      --page: #e9f3e5;
      --surface: #fffdf3;
      --tile: #f4edcf;
      --ink: #344537;
      --muted: #6d7a69;
      --accent: #d66b4d;
      --line: #c2d8bd;
      --shadow: 0 3px 0 rgba(56, 91, 57, .12);
      --radius: 14px;
      --font: "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); transition: background .2s, color .2s; }
    button { color: inherit; font: inherit; }
    .shell { width: min(100%, 1060px); margin: 0 auto; padding: 26px 22px 38px; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
    .brand-mark { display: grid; place-items: center; width: 27px; height: 27px; border: 2px solid var(--accent); border-radius: 9px; color: var(--accent); font-size: 15px; }
    .brief { font-size: 11px; font-weight: 700; color: var(--muted); }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 27px; line-height: 1.2; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .route-total { flex: 0 0 auto; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 12px; font-weight: 800; }
    .style-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 19px; }
    .style-tab { min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); cursor: pointer; transition: border-color .18s, transform .18s, box-shadow .18s; }
    .style-tab:hover { transform: translateY(-1px); }
    .style-tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), var(--shadow); }
    .swatches { display: flex; flex: 0 0 auto; }
    .swatches i { width: 13px; height: 23px; border: 1px solid rgba(40,40,30,.12); border-radius: 5px; margin-left: -3px; }
    .swatches i:first-child { margin-left: 0; }
    .tab-copy { min-width: 0; }
    .tab-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .tab-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 1px 10px; }
    .section-head h2 { margin: 0; font-size: 15px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .merge-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .merge-step { min-width: 0; position: relative; padding: 10px 10px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .step-heading { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .step-heading strong { font-size: 11px; }
    .level-mark { padding: 4px 6px; border-radius: 7px; background: var(--tile); color: var(--accent); font-size: 9px; line-height: 1; font-weight: 900; white-space: nowrap; }
    .result-art { height: 89px; display: grid; place-items: center; margin: 3px 0 1px; }
    .result-art img { display: block; width: 86px; height: 86px; object-fit: contain; }
    .food-name { display: block; overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 900; }
    .equation { min-height: 29px; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 6px; padding-top: 7px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .equation img { width: 22px; height: 22px; object-fit: contain; }
    .equation .arrow { color: var(--accent); font-size: 15px; }
    .start-label { color: var(--muted); font-size: 10px; font-weight: 700; }
    .board-section { margin-top: 22px; }
    .board-demo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; max-width: 430px; padding: 8px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--tile); }
    .board-cell { display: grid; place-items: center; aspect-ratio: 1; border-radius: max(2px, calc(var(--radius) - 6px)); background: var(--surface); }
    .board-cell img { width: 80%; height: 80%; object-fit: contain; }
    .palette-row { display: flex; align-items: center; gap: 8px; margin-top: 11px; color: var(--muted); font-size: 10px; }
    .palette-row b { color: var(--ink); font-size: 10px; }
    .palette-chip { width: 19px; height: 14px; border: 1px solid rgba(40,40,30,.12); border-radius: 4px; }
    .footer-note { margin: 23px 0 0; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }

    body[data-theme="watercolor"] {
      --page: #edf0e8; --surface: #fbfaf3; --tile: #e5eadb; --ink: #4d5848;
      --muted: #7d8574; --accent: #bf785d; --line: #d4d7c8; --shadow: 0 2px 0 rgba(74, 81, 62, .07);
      --radius: 4px; --font: "Palatino Linotype", "Microsoft YaHei", serif;
    }
    body[data-theme="pixel"] {
      --page: #285c3e; --surface: #fff0ad; --tile: #d9953f; --ink: #542e27;
      --muted: #786044; --accent: #b6392f; --line: #694238; --shadow: 3px 3px 0 #694238;
      --radius: 0px; --font: "Courier New", monospace;
    }
    body[data-theme="pixel"] .shell { max-width: 1120px; }
    body[data-theme="pixel"] .brand, body[data-theme="pixel"] .brief { color: #f3e3ac; }
    body[data-theme="pixel"] .style-tab { border-width: 2px; }
    body[data-theme="pixel"] .level-mark { border: 1px solid var(--line); }
    body[data-theme="pixel"] .merge-step, body[data-theme="pixel"] .board-demo, body[data-theme="pixel"] .style-tab { image-rendering: pixelated; }
    @media (max-width: 680px) {
      .shell { padding: 18px 13px 28px; }
      .intro { align-items: start; }
      h1 { font-size: 23px; }
      .brief { display: none; }
      .style-picker { gap: 6px; }
      .style-tab { padding: 9px 7px; gap: 6px; }
      .swatches i { width: 9px; height: 19px; }
      .tab-copy strong { font-size: 10px; }
      .tab-copy small { font-size: 9px; }
      .merge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .merge-step { padding: 9px; }
      .route-total { font-size: 10px; padding: 8px; }
      .section-head { align-items: start; flex-direction: column; gap: 3px; }
      .board-demo { max-width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body data-theme="sticker">
  <main class="shell">
    <div class="topline">
      <div class="brand"><span class="brand-mark">菜</span> SIS BAZAAR <span>/</span> 美术提案</div>
      <div class="brief">VEGETABLE MERGE · VISUAL STUDY 01</div>
    </div>
    <header class="intro">
      <div>
        <h1>蔬菜合成路线</h1>
        <p class="subtitle">同一组蔬菜，三种美术方向。选一个最适合你的菜园。</p>
      </div>
      <div class="route-total">8 个等级 <span aria-hidden="true">·</span> 7 次合成</div>
    </header>
    <nav class="style-picker" role="tablist" aria-label="美术风格">
      <button class="style-tab" id="tab-sticker" role="tab" aria-selected="true" aria-controls="preview" data-theme-choice="sticker">
        <span class="swatches" aria-hidden="true"><i style="background:#e9f3e5"></i><i style="background:#fffdf3"></i><i style="background:#d66b4d"></i></span>
        <span class="tab-copy"><strong>软萌立体贴纸</strong><small>明快 · 圆润 · 有层次</small></span>
      </button>
      <button class="style-tab" id="tab-watercolor" role="tab" aria-selected="false" aria-controls="preview" data-theme-choice="watercolor">
        <span class="swatches" aria-hidden="true"><i style="background:#edf0e8"></i><i style="background:#fbfaf3"></i><i style="background:#bf785d"></i></span>
        <span class="tab-copy"><strong>清爽手绘水彩</strong><small>自然 · 轻柔 · 纸感</small></span>
      </button>
      <button class="style-tab" id="tab-pixel" role="tab" aria-selected="false" aria-controls="preview" data-theme-choice="pixel">
        <span class="swatches" aria-hidden="true"><i style="background:#285c3e"></i><i style="background:#fff0ad"></i><i style="background:#b6392f"></i></span>
        <span class="tab-copy"><strong>复古像素农场</strong><small>高对比 · 方块 · 街机感</small></span>
      </button>
    </nav>
    <section id="preview" role="tabpanel" aria-labelledby="tab-sticker">
      <div class="section-head">
        <h2>合成路线</h2>
        <p>每两份同级蔬菜，合成一份下一级</p>
      </div>
      <div class="merge-grid" id="mergeGrid"></div>
      <section class="board-section" aria-labelledby="boardTitle">
        <div class="section-head"><h2 id="boardTitle">棋盘观感</h2><p>图标缩小到游戏格后的配色预览</p></div>
        <div class="board-demo" id="boardDemo" aria-label="蔬菜棋盘色彩预览"></div>
        <div class="palette-row" id="paletteRow"></div>
      </section>
    </section>
    <p class="footer-note">风格提案预览 · 当前不影响游戏内素材与玩法</p>
  </main>
  <script>
    (() => {
      const vegetables = [
        { id: 'cabbage', name: '包菜' },
        { id: 'tomato', name: '番茄' },
        { id: 'pepper', name: '彩椒' },
        { id: 'carrot', name: '胡萝卜' },
        { id: 'mushroom', name: '香菇' },
        { id: 'corn', name: '玉米' },
        { id: 'potato', name: '土豆' },
        { id: 'purple-cabbage', name: '紫甘蓝' },
      ];
      const themes = {
        sticker: { name: '软萌立体贴纸', colors: ['#e9f3e5', '#fffdf3', '#f4edcf', '#d66b4d'] },
        watercolor: { name: '清爽手绘水彩', colors: ['#edf0e8', '#fbfaf3', '#e5eadb', '#bf785d'] },
        pixel: { name: '复古像素农场', colors: ['#285c3e', '#fff0ad', '#d9953f', '#b6392f'] },
      };
      const asset = (theme, id) => `assets/${theme}/${id}.png`;
      const grid = document.getElementById('mergeGrid');
      const board = document.getElementById('boardDemo');
      const paletteRow = document.getElementById('paletteRow');
      const panel = document.getElementById('preview');

      function render() {
        const theme = document.body.dataset.theme;
        const route = vegetables.map((vegetable, index) => {
          const previous = vegetables[index - 1];
          const formula = previous
            ? `<img src="${asset(theme, previous.id)}" alt=""><span>+</span><img src="${asset(theme, previous.id)}" alt=""><span class="arrow" aria-hidden="true">→</span>`
            : '<span class="start-label">蔬菜种子 · 合成起点</span>';
          return `<article class="merge-step">
            <div class="step-heading"><strong>第 ${index + 1} 级</strong><span class="level-mark">LV.${index + 1}</span></div>
            <div class="result-art"><img src="${asset(theme, vegetable.id)}" alt="${vegetable.name}"></div>
            <span class="food-name">${vegetable.name}</span>
            <div class="equation">${formula}</div>
          </article>`;
        }).join('');
        grid.innerHTML = route;
        board.innerHTML = vegetables.map(item => `<div class="board-cell"><img src="${asset(theme, item.id)}" alt="${item.name}"></div>`).join('');
        paletteRow.innerHTML = `<b>主题色</b>${themes[theme].colors.map(color => `<span class="palette-chip" style="background:${color}" title="${color}"></span>`).join('')}`;
        document.getElementById('preview').setAttribute('aria-labelledby', `tab-${theme}`);
      }

      document.querySelectorAll('[data-theme-choice]').forEach((button, index, buttons) => {
        button.addEventListener('click', () => {
          const theme = button.dataset.themeChoice;
          document.body.dataset.theme = theme;
          buttons.forEach(item => item.setAttribute('aria-selected', String(item === button)));
          render();
        });
        button.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
          event.preventDefault();
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          buttons[(index + direction + buttons.length) % buttons.length].focus();
          buttons[(index + direction + buttons.length) % buttons.length].click();
        });
      });
      render();
    })();
  </script>
</body>
</html>
